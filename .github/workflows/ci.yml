name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-react:
    name: Frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_FRONT_END/01_REACT_AP07
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: 01_FRONT_END/01_REACT_AP07/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  api-node:
    name: API Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_BACK_END/01_API_NODE
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: 02_BACK_END/01_API_NODE/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check startup configuration
        run: pnpm check

  maven:
    name: Maven Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Test Spring Web
        run: mvn -f 02_BACK_END/02_SPRING_WEB/pom.xml test

      - name: Test Java Web
        run: mvn -f 02_BACK_END/03_JAVA_WEB/pom.xml test
